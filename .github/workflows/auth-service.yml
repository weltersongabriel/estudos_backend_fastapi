name: Auth Service CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run authentication tests
    runs-on: ubuntu-24.04
    env:
      SECRET_KEY: ci-only-secret-key-for-tests
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi sqlalchemy alembic "passlib[bcrypt]" "bcrypt<4.1" "python-jose[cryptography]" python-dotenv python-multipart pytest httpx

      - name: Initialize test database
        run: alembic upgrade head

      - name: Run authentication tests
        run: python -m pytest test/test_user.py -v